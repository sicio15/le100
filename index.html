<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>le100.io - Cienpies Battle Online</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { position:fixed; inset:0; overflow:hidden; overscroll-behavior:none; }
    body { font-family:'Rubik',sans-serif; background:#070b14;
        -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
    body.playing { cursor:none; }
    #gameCanvas { position:fixed; inset:0; display:block; }
    #vignette { position:fixed; inset:0; pointer-events:none; z-index:5;
        background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }

    .panel { background:rgba(10,15,30,.6); backdrop-filter:blur(8px);
        border:1px solid rgba(255,255,255,.08); border-radius:14px; }

    /* ===== HUD ===== */
    .hud { position:fixed; z-index:10; color:#fff; }
    #scorePanel { top:16px; left:16px; padding:12px 18px; }
    #scorePanel .big { font-family:'Orbitron'; font-size:30px; font-weight:900; color:#ffd700;
        text-shadow:0 0 15px rgba(255,215,0,.6); }
    #scorePanel .lbl { font-size:11px; letter-spacing:2px; color:#8fa3c8; }
    #rankTxt { font-size:12px; color:#4ecdc4; margin-top:2px; }

    #onlinePill { top:16px; left:50%; transform:translateX(-50%); padding:8px 18px;
        color:#7CFC7C; font-weight:600; font-size:13px; }
    #onlinePill .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
        background:#7CFC7C; box-shadow:0 0 8px #7CFC7C; margin-right:6px; animation:blink 1.5s infinite; }
    @keyframes blink { 50% { opacity:.4; } }

    #leaderboard { top:16px; right:16px; padding:14px 16px; min-width:210px; }
    #leaderboard h3 { font-family:'Orbitron'; font-size:13px; color:#ffd700; margin-bottom:8px; letter-spacing:2px; }
    .lb-row { display:flex; justify-content:space-between; font-size:13px; padding:2px 0; color:#cfd8ea; }
    .lb-row.me { color:#7CFC7C; font-weight:800; }

    #abilities { bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:12px; }
    .slot { width:64px; height:64px; border-radius:14px; position:relative; overflow:hidden;
        background:rgba(10,15,30,.7); border:2px solid rgba(255,255,255,.15);
        display:flex; align-items:center; justify-content:center; font-size:28px;
        backdrop-filter:blur(6px); transition:border-color .2s, box-shadow .2s; }
    .slot .cd, .mab .cd { position:absolute; inset:0; background:rgba(0,0,0,.75);
        transform-origin:bottom; transform:scaleY(0); }
    .slot .key { position:absolute; top:2px; left:5px; font-size:10px; font-weight:800; color:#8fa3c8; }
    .slot.ready, .mab.ready { border-color:#7CFC7C; box-shadow:0 0 14px rgba(124,252,124,.35); }
    .slot.active, .mab.active { border-color:#ffd700; box-shadow:0 0 22px rgba(255,215,0,.8); }

    #minimapBox { bottom:18px; right:18px; padding:8px; }
    #minimap { display:block; border-radius:8px; }

    #chat { bottom:18px; left:18px; width:290px; padding:10px; }
    #chatMsgs { max-height:130px; overflow-y:auto; font-size:12px; margin-bottom:6px; }
    #chatMsgs div { margin:2px 0; text-shadow:1px 1px 2px #000; }
    #chatInput { width:100%; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
        color:#fff; padding:7px 10px; border-radius:8px; font-family:'Rubik'; font-size:12px; outline:none; }
    #chatInput:focus { border-color:#4ecdc4; }

    #hint { top:70px; left:16px; padding:10px 14px; font-size:11px; color:#8fa3c8; line-height:1.7; }
    #hint b { color:#fff; }

    #toasts { position:fixed; top:90px; left:50%; transform:translateX(-50%); z-index:50;
        display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none; }
    .toast { background:rgba(10,15,30,.85); border:1px solid rgba(255,215,0,.4); color:#ffd700;
        padding:8px 22px; border-radius:30px; font-weight:800; font-size:15px;
        animation:toastIn 2.4s forwards; text-shadow:0 0 10px rgba(255,215,0,.5); white-space:nowrap; }
    @keyframes toastIn { 0%{opacity:0; transform:translateY(-15px) scale(.8);} 10%{opacity:1; transform:none;}
        80%{opacity:1;} 100%{opacity:0; transform:translateY(-10px);} }

    /* ===== CONTROLES MÓVILES ===== */
    #joyZone { position:fixed; left:0; top:0; width:55%; height:100%; z-index:14;
        display:none; touch-action:none; }
    body.mobile #joyZone { display:block; }
    #joyBase { position:fixed; width:120px; height:120px; border:2px solid rgba(255,255,255,.35);
        border-radius:50%; display:none; pointer-events:none; z-index:16;
        background:rgba(255,255,255,.06); transform:translate(-50%,-50%); }
    #joyKnob { position:fixed; width:56px; height:56px; border-radius:50%;
        background:rgba(255,255,255,.5); display:none; pointer-events:none; z-index:17;
        box-shadow:0 0 12px rgba(255,255,255,.4); transform:translate(-50%,-50%); }
    #mAbs { position:fixed; right:14px; bottom:14px; z-index:15; display:none;
        grid-template-columns:repeat(2,62px); gap:10px; }
    body.mobile #mAbs { display:grid; }
    .mab { width:62px; height:62px; border-radius:50%; position:relative; overflow:hidden;
        background:rgba(10,15,30,.65); border:2px solid rgba(255,255,255,.2);
        display:flex; align-items:center; justify-content:center; font-size:26px;
        backdrop-filter:blur(4px); touch-action:none; }
    .mab:active { transform:scale(.9); }
    body.mobile #abilities { display:none; }
    body.mobile #chat, body.mobile #hint, body.mobile #minimapBox { display:none; }
    body.mobile #leaderboard { min-width:0; padding:8px 12px; transform:scale(.85); transform-origin:top right; }
    body.mobile #scorePanel { transform:scale(.85); transform-origin:top left; }

    /* ===== MENU ===== */
    #menu { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
        background:rgba(5,8,16,.55); backdrop-filter:blur(5px); }
    .card { text-align:center; padding:36px 52px; border-radius:26px; max-width:94vw;
        background:rgba(10,15,30,.72); border:1px solid rgba(255,255,255,.1);
        box-shadow:0 30px 80px rgba(0,0,0,.7), 0 0 60px rgba(78,205,196,.08); }
    #logoCanvas { width:190px; height:150px; margin:0 auto; display:block; }
    .title { font-family:'Orbitron'; font-weight:900; font-size:clamp(40px, 9vw, 62px); letter-spacing:2px;
        background:linear-gradient(90deg,#ffd700,#ff6b6b,#4ecdc4,#ffd700); background-size:300% 100%;
        -webkit-background-clip:text; background-clip:text; color:transparent;
        animation:shine 4s linear infinite; filter:drop-shadow(0 0 18px rgba(255,215,0,.35)); }
    @keyframes shine { to { background-position:300% 0; } }
    .subtitle { color:#8fa3c8; letter-spacing:6px; font-size:13px; margin:4px 0 22px; font-weight:600; }
    #nameInput { width:280px; max-width:80vw; padding:13px; font-size:17px; text-align:center; border-radius:12px;
        border:2px solid rgba(255,255,255,.15); background:rgba(255,255,255,.06); color:#fff;
        font-family:'Rubik'; outline:none; margin-bottom:14px; transition:border-color .2s; }
    #nameInput:focus { border-color:#ffd700; }
    .skins { display:flex; gap:10px; justify-content:center; margin-bottom:20px; flex-wrap:wrap; }
    .skin { width:38px; height:38px; border-radius:50%; cursor:pointer; border:3px solid transparent;
        transition:transform .15s, border-color .15s; }
    .skin:hover { transform:scale(1.15); }
    .skin.sel { border-color:#fff; transform:scale(1.2); box-shadow:0 0 14px rgba(255,255,255,.5); }
    #playBtn { padding:16px 70px; font-size:22px; font-weight:800; font-family:'Orbitron';
        letter-spacing:3px; color:#fff; border:none; border-radius:40px; cursor:pointer;
        background:linear-gradient(45deg,#ff6b6b,#ffd700); box-shadow:0 8px 30px rgba(255,107,107,.4);
        transition:transform .15s, box-shadow .15s; animation:pulseBtn 2s infinite; }
    #playBtn:hover { transform:scale(1.08); box-shadow:0 8px 45px rgba(255,215,0,.7); }
    @keyframes pulseBtn { 50% { box-shadow:0 8px 45px rgba(255,215,0,.65); } }
    .ctrlGrid { display:flex; gap:14px; justify-content:center; margin-top:22px; }
    .ctrl { font-size:11px; color:#8fa3c8; }
    .ctrl .k { display:inline-block; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2);
        border-radius:6px; padding:2px 8px; color:#fff; font-weight:800; margin-right:5px; }

    /* ===== MUERTE ===== */
    #death { position:fixed; inset:0; z-index:90; display:none; align-items:center; justify-content:center;
        background:rgba(20,0,0,.55); backdrop-filter:blur(4px); }
    #death .card { border-color:rgba(255,0,0,.3); }
    #death h1 { font-family:'Orbitron'; font-size:44px; color:#ff4757;
        text-shadow:0 0 25px rgba(255,71,87,.7); margin-bottom:8px; }
    #deathReason { color:#cfd8ea; font-size:16px; margin-bottom:6px; }
    #deathScore { color:#ffd700; font-size:22px; font-weight:800; margin-bottom:14px; }
    #respawnTxt { color:#4ecdc4; font-size:15px; font-weight:600; }

    @media (max-width:600px) {
        .card { padding:24px 18px; }
        #logoCanvas { width:150px; height:118px; }
        .ctrlGrid { display:none; }
        .subtitle { letter-spacing:3px; font-size:11px; }
    }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="vignette"></div>

<!-- HUD -->
<div id="scorePanel" class="hud panel"><div class="lbl">LONGITUD</div><div class="big" id="scoreVal">10</div><div id="rankTxt">Rank #-</div></div>
<div id="onlinePill" class="hud panel"><span class="dot"></span><span id="onlineCount">1</span> en línea</div>
<div id="leaderboard" class="hud panel"><h3>🏆 RANKING</h3><div id="lbList"></div></div>
<div id="hint" class="hud panel"><b>1</b> Dash · <b>2</b> Escudo · <b>3</b> Imán · <b>4</b> Veneno<br><b>Enter</b> Chat · Muévete con el mouse</div>
<div id="abilities" class="hud"></div>
<div id="minimapBox" class="hud panel"><canvas id="minimap" width="170" height="170"></canvas></div>
<div id="chat" class="hud panel"><div id="chatMsgs"></div><input id="chatInput" placeholder="Enter para chatear..." maxlength="80"></div>
<div id="toasts"></div>

<!-- CONTROLES MÓVILES -->
<div id="joyZone"></div>
<div id="joyBase"></div>
<div id="joyKnob"></div>
<div id="mAbs"></div>

<!-- MENU -->
<div id="menu">
    <div class="card">
        <canvas id="logoCanvas" width="190" height="150"></canvas>
        <div class="title">le100.io</div>
        <div class="subtitle">CIENPIES BATTLE ONLINE</div>
        <input id="nameInput" placeholder="Tu nombre..." maxlength="14" value=""><br>
        <div class="skins" id="skins"></div>
        <button id="playBtn">JUGAR</button>
        <div class="ctrlGrid">
            <div class="ctrl"><span class="k">🖱️</span>Mover</div>
            <div class="ctrl"><span class="k">1</span>Dash</div>
            <div class="ctrl"><span class="k">2</span>Escudo</div>
            <div class="ctrl"><span class="k">3</span>Imán</div>
            <div class="ctrl"><span class="k">4</span>Veneno</div>
        </div>
    </div>
</div>

<!-- MUERTE -->
<div id="death"><div class="card">
    <h1>💀 ELIMINADO</h1>
    <div id="deathReason"></div>
    <div id="deathScore"></div>
    <div id="respawnTxt">Renaciendo en 5...</div>
</div></div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
'use strict';
const TAU = Math.PI * 2;
const canvas = document.getElementById('gameCanvas');
let ctx = canvas.getContext('2d');
const mm = document.getElementById('minimap').getContext('2d');
let W = 0, H = 0, DPR = 1;
function fit() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
fit();
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', fit);

const isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isMobile) document.body.classList.add('mobile');

let mouseX = W / 2, mouseY = H / 2;
window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

// Bloqueos táctiles (zoom, scroll, menú contextual)
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
window.addEventListener('contextmenu', e => { if (isMobile) e.preventDefault(); });

/* ============ SKINS Y HABILIDADES ============ */
const SKINS = [
    { name:'Veneno',  hue:120 }, { name:'Fuego', hue:8 },
    { name:'Hielo',   hue:197 }, { name:'Oro',   hue:48 },
    { name:'Neón',    hue:310 }, { name:'Fantasma', hue:265 }
];
let selSkin = 0;
const skinsBox = document.getElementById('skins');
SKINS.forEach((s, i) => {
    const b = document.createElement('div');
    b.className = 'skin' + (i === 0 ? ' sel' : '');
    b.title = s.name;
    b.style.background = `linear-gradient(135deg, hsl(${s.hue},85%,55%), hsl(${(s.hue+40)%360},90%,65%))`;
    b.onclick = () => { selSkin = i; document.querySelectorAll('.skin').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); };
    skinsBox.appendChild(b);
});

const AB_DEF = {
    dash:   { icon:'⚡', key:'1', name:'DASH',   cd:180, dur:60  },
    shield: { icon:'🛡️', key:'2', name:'ESCUDO', cd:300, dur:180 },
    magnet: { icon:'🧲', key:'3', name:'IMÁN',   cd:420, dur:300 },
    poison: { icon:'☠️', key:'4', name:'VENENO', cd:600, dur:300 }
};
const abUI = {};
const abBox = document.getElementById('abilities');
const mabUI = {};
const mAbsBox = document.getElementById('mAbs');
Object.keys(AB_DEF).forEach(k => {
    const d = AB_DEF[k];
    // Desktop
    const el = document.createElement('div');
    el.className = 'slot ready';
    el.innerHTML = `<div class="cd"></div><span style="position:relative">${d.icon}</span><span class="key">${d.key}</span>`;
    abBox.appendChild(el);
    abUI[k] = { el, cdEl: el.querySelector('.cd') };
    // Móvil
    const b = document.createElement('div');
    b.className = 'mab ready';
    b.innerHTML = `<div class="cd"></div><span style="position:relative">${d.icon}</span>`;
    b.addEventListener('touchstart', e => { e.preventDefault(); useAbility(k); }, { passive:false });
    mAbsBox.appendChild(b);
    mabUI[k] = { el:b, cdEl:b.querySelector('.cd') };
});

/* ============ JOYSTICK ============ */
const joyZone = document.getElementById('joyZone');
const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
let joyId = null, joyCX = 0, joyCY = 0, joyActive = false;
let joyVec = { x:0, y:0 };

joyZone.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    joyId = t.identifier;
    joyCX = t.clientX; joyCY = t.clientY;
    joyBase.style.left = joyCX + 'px'; joyBase.style.top = joyCY + 'px';
    joyKnob.style.left = joyCX + 'px'; joyKnob.style.top = joyCY + 'px';
    joyBase.style.display = 'block'; joyKnob.style.display = 'block';
    joyActive = true;
}, { passive:false });

joyZone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
        if (t.identifier !== joyId) continue;
        let dx = t.clientX - joyCX, dy = t.clientY - joyCY;
        const max = 45, d = Math.hypot(dx, dy);
        if (d > max) { dx = dx/d*max; dy = dy/d*max; }
        joyKnob.style.left = (joyCX + dx) + 'px';
        joyKnob.style.top  = (joyCY + dy) + 'px';
        if (d > 8) joyVec = { x: dx/max, y: dy/max };   // zona muerta
    }
}, { passive:false });

function joyEnd(e) {
    for (const t of e.changedTouches) {
        if (t.identifier === joyId) {
            joyId = null; joyActive = false;
            joyBase.style.display = 'none'; joyKnob.style.display = 'none';
        }
    }
}
joyZone.addEventListener('touchend', joyEnd);
joyZone.addEventListener('touchcancel', joyEnd);

/* ============ ESTADO ============ */
let WORLD_SIZE = 5000;
let state = 'menu';
let myId = null;
let frame = 0;
let shake = 0;
let worldFoods = [];
const remotes = new Map();
const particles = [];
let deathTime = 0;

const me = {
    name:'Jugador', hue:120, segments:[], angle:0, score:10, maxSegments:10,
    alive:false, abilities:{ dash:{cd:0,active:0}, shield:{cd:0,active:0}, magnet:{cd:0,active:0}, poison:{cd:0,active:0} }
};
function resetMe(x, y) {
    me.segments = [];
    for (let i = 0; i < me.maxSegments; i++) me.segments.push({ x, y });
    me.score = 10; me.maxSegments = 10; me.alive = true; me.angle = 0;
    Object.keys(me.abilities).forEach(k => { me.abilities[k].cd = 0; me.abilities[k].active = 0; });
}

/* ============ SOCKET ============ */
const socket = io();
socket.on('init', d => { myId = d.playerId; worldFoods = d.foods; WORLD_SIZE = d.worldSize; });
socket.on('playerJoined', p => { if (p.id !== myId) { remotes.set(p.id, new Remote(p)); toast(`📥 ${p.name} entró`); } });
socket.on('playerLeft', id => { const r = remotes.get(id); if (r) toast(`📤 ${r.name} salió`); remotes.delete(id); });
socket.on('gameState', d => {
    worldFoods = d.foods;
    d.players.forEach(p => {
        if (p.id === myId) return;
        if (remotes.has(p.id)) remotes.get(p.id).sync(p);
        else remotes.set(p.id, new Remote(p));
    });
});
socket.on('foodEaten', d => {
    const f = worldFoods.find(x => x.id === d.foodId);
    if (f) { burst(f.x, f.y, foodColor(f), 10); worldFoods = worldFoods.filter(x => x.id !== d.foodId); }
});
socket.on('foodUpdate', f => { worldFoods = f; });
socket.on('playerDied', d => {
    const r = remotes.get(d.id);
    const segs = d.segments || (r && r.segments) || [];
    if (segs[0]) burst(segs[0].x, segs[0].y, r ? `hsl(${r.hue},85%,60%)` : '#fff', 40);
    if (r) toast(`💀 ${r.name} murió`);
});
socket.on('respawned', d => {
    resetMe(d.x, d.y);
    state = 'playing';
    document.getElementById('death').style.display = 'none';
    toast('✨ ¡Renaciste!');
});
socket.on('chatMessage', d => addChat(`${d.name}: ${d.message}`, '#fff'));

/* ============ UTILIDADES ============ */
function hueOf(c) {
    if (typeof c === 'number') return c;
    const m = /hsl\(\s*(\d+)/.exec(c || '');
    return m ? +m[1] : (Math.random() * 360 | 0);
}
function toast(txt) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = txt;
    const box = document.getElementById('toasts');
    box.appendChild(t);
    setTimeout(() => t.remove(), 2400);
    while (box.children.length > 3) box.firstChild.remove();
}
function addChat(txt, color) {
    const box = document.getElementById('chatMsgs');
    const d = document.createElement('div');
    d.style.color = color; d.textContent = txt;
    box.appendChild(d); box.scrollTop = 1e9;
    while (box.children.length > 40) box.firstChild.remove();
}
function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
        const a = TAU * i / n, s = 2 + Math.random() * 3;
        particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:50, max:50, color, size:2+Math.random()*3 });
    }
}
const FOOD_PAL = ['#ff6b6b','#ffa502','#7bed9f','#70a1ff','#ff7eb3'];
function foodColor(f) { return f.type === 'big' ? '#ffd700' : f.type === 'special' ? '#4ecdc4' : FOOD_PAL[f.id % FOOD_PAL.length]; }

/* ============ REMOTO ============ */
class Remote {
    constructor(p) {
        this.id = p.id; this.hue = hueOf(p.color);
        this.segments = (p.segments && p.segments.length ? p.segments : [{x:p.x,y:p.y}]).map(s => ({...s}));
        this.targets = this.segments.map(s => ({...s}));
        this.name = p.name; this.angle = p.angle || 0; this.score = p.score || 10;
        this.alive = p.alive !== false; this.abilities = p.abilities || {};
    }
    sync(p) {
        this.name = p.name; this.score = p.score; this.alive = p.alive !== false;
        this.angle = p.angle; this.abilities = p.abilities || this.abilities;
        if (p.segments && p.segments.length) this.targets = p.segments;
        while (this.segments.length < this.targets.length) {
            const l = this.segments[this.segments.length-1]; this.segments.push({x:l.x, y:l.y});
        }
        if (this.segments.length > this.targets.length) this.segments.length = this.targets.length;
    }
    update() {
        for (let i = 0; i < this.segments.length; i++) {
            const t = this.targets[i]; if (!t) continue;
            this.segments[i].x += (t.x - this.segments[i].x) * 0.3;
            this.segments[i].y += (t.y - this.segments[i].y) * 0.3;
        }
    }
}

/* ============ MODO DEMO ============ */
const demoCents = [], demoFoods = [];
for (let i = 0; i < 220; i++) demoFoods.push({ id:i, x:Math.random()*WORLD_SIZE, y:Math.random()*WORLD_SIZE, type:Math.random()<.08?'big':'normal' });
for (let i = 0; i < 7; i++) {
    const c = { hue:Math.random()*360|0, segments:[], angle:Math.random()*TAU, alive:true,
        abilities:{}, tx:Math.random()*WORLD_SIZE, ty:Math.random()*WORLD_SIZE, score:20+i*9, name:'' };
    const x = Math.random()*WORLD_SIZE, y = Math.random()*WORLD_SIZE;
    for (let j = 0; j < 15+i*8; j++) c.segments.push({x, y});
    demoCents.push(c);
}
function updateDemo() {
    demoCents.forEach(c => {
        const h = c.segments[0];
        if (Math.random() < 0.005) { c.tx = Math.random()*WORLD_SIZE; c.ty = Math.random()*WORLD_SIZE; }
        const ta = Math.atan2(c.ty-h.y, c.tx-h.x);
        let d = ta - c.angle; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
        c.angle += d * 0.03;
        h.x = Math.max(50, Math.min(WORLD_SIZE-50, h.x + Math.cos(c.angle)*2));
        h.y = Math.max(50, Math.min(WORLD_SIZE-50, h.y + Math.sin(c.angle)*2));
        for (let i = 1; i < c.segments.length; i++) {
            const p = c.segments[i-1], s = c.segments[i];
            const dx = p.x-s.x, dy = p.y-s.y, dist = Math.hypot(dx,dy);
            if (dist > 10) { const a = Math.atan2(dy,dx); s.x = p.x-Math.cos(a)*10; s.y = p.y-Math.sin(a)*10; }
        }
    });
}

/* ============ DIBUJO ============ */
function segSize(i) { return i === 0 ? 16 : Math.max(9, 13 - i * 0.05); }

function drawCentipede(c, camX, camY, t) {
    const segs = c.segments;
    if (!segs || !segs.length || !c.alive) return;
    const head = segs[0];
    const sx = head.x - camX, sy = head.y - camY;
    const margin = segs.length * 10 + 160;
    if (sx < -margin || sx > W+margin || sy < -margin || sy > H+margin) return;

    const hue = c.hue;
    const ab = c.abilities || {};
    const dashing = ab.dash && ab.dash.active > 0;

    if (ab.poison && ab.poison.active > 0) {
        const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, 55);
        g.addColorStop(0, 'rgba(160,32,240,.35)'); g.addColorStop(1, 'rgba(160,32,240,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, 55, 0, TAU); ctx.fill();
    }
    if (ab.magnet && ab.magnet.active > 0) {
        ctx.save();
        ctx.strokeStyle = 'rgba(78,205,196,.5)'; ctx.lineWidth = 2;
        ctx.setLineDash([10, 12]); ctx.lineDashOffset = -t * 60;
        ctx.beginPath(); ctx.arc(sx, sy, 90, 0, TAU); ctx.stroke();
        ctx.restore();
    }
    if (dashing) {
        for (let i = 2; i < Math.min(segs.length, 10); i += 2) {
            const s = segs[i];
            ctx.globalAlpha = 0.15;
            ctx.fillStyle = `hsl(${hue},85%,60%)`;
            ctx.beginPath(); ctx.arc(s.x-camX, s.y-camY, segSize(i)+4, 0, TAU); ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    ctx.lineCap = 'round';
    for (let i = segs.length-1; i >= 1; i--) {
        const p = segs[i], prev = segs[i-1];
        const bx = p.x-camX, by = p.y-camY;
        if (bx < -60 || bx > W+60 || by < -60 || by > H+60) continue;
        const ang = Math.atan2(p.y-prev.y, p.x-prev.x);
        const sz = segSize(i);
        ctx.strokeStyle = `hsl(${hue},70%,38%)`; ctx.lineWidth = 3;
        for (const side of [-1, 1]) {
            const la = ang + side * (Math.PI/2 + Math.sin(t*12 + i*0.9) * 0.45);
            ctx.beginPath(); ctx.moveTo(bx, by);
            ctx.lineTo(bx + Math.cos(la)*(sz+7), by + Math.sin(la)*(sz+7));
            ctx.stroke();
        }
    }

    for (let i = segs.length-1; i >= 0; i--) {
        const s = segs[i];
        const bx = s.x-camX, by = s.y-camY;
        if (bx < -60 || bx > W+60 || by < -60 || by > H+60) continue;
        const sz = segSize(i);
        const light = i % 2 === 0 ? 55 : 45;
        const h2 = i % 6 === 0 ? (hue+35) % 360 : hue;
        const g = ctx.createRadialGradient(bx-sz*0.3, by-sz*0.3, 1, bx, by, sz);
        g.addColorStop(0, `hsl(${h2},90%,${light+18}%)`);
        g.addColorStop(1, `hsl(${h2},85%,${light-12}%)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(bx, by, sz, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.5; ctx.stroke();
    }

    const ha = c.angle;
    ctx.strokeStyle = `hsl(${hue},90%,70%)`; ctx.lineWidth = 2.5;
    for (const side of [-1, 1]) {
        const a1 = ha + side*0.5, a2 = ha + side*0.9;
        const ex = sx + Math.cos(a2)*26, ey = sy + Math.sin(a2)*26;
        ctx.beginPath(); ctx.moveTo(sx, sy);
        ctx.quadraticCurveTo(sx+Math.cos(a1)*14, sy+Math.sin(a1)*14, ex, ey);
        ctx.stroke();
        ctx.fillStyle = `hsl(${(hue+40)%360},95%,70%)`;
        ctx.beginPath(); ctx.arc(ex, ey, 3, 0, TAU); ctx.fill();
    }
    for (const side of [-1, 1]) {
        const ea = ha + side*0.42;
        const ex = sx + Math.cos(ea)*8, ey = sy + Math.sin(ea)*8;
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(ex, ey, 5, 0, TAU); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(ex+Math.cos(ha)*2.2, ey+Math.sin(ha)*2.2, 2.5, 0, TAU); ctx.fill();
    }

    if (ab.shield && ab.shield.active > 0) {
        ctx.save();
        ctx.strokeStyle = 'rgba(0,255,255,.85)'; ctx.lineWidth = 3;
        ctx.fillStyle = 'rgba(0,255,255,.1)';
        ctx.setLineDash([14, 8]); ctx.lineDashOffset = t * 80;
        ctx.beginPath(); ctx.arc(sx, sy, 26, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.restore();
    }

    if (c.name) {
        ctx.font = '800 13px Rubik'; ctx.textAlign = 'center';
        ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.7)';
        ctx.strokeText(c.name, sx, sy-26);
        ctx.fillStyle = '#fff'; ctx.fillText(c.name, sx, sy-26);
    }
}

function drawFood(f, camX, camY, t) {
    const x = f.x-camX, y = f.y-camY;
    if (x < -40 || x > W+40 || y < -40 || y > H+40) return;
    const col = foodColor(f);
    const pulse = Math.sin(t*4 + f.id) * 1.5;
    if (f.type === 'big') {
        ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 18;
        ctx.fillStyle = col;
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
            const r = i % 2 === 0 ? 11+pulse : 5;
            const a = (Math.PI/5)*i - Math.PI/2 + t;
            ctx.lineTo(x+Math.cos(a)*r, y+Math.sin(a)*r);
        }
        ctx.closePath(); ctx.fill(); ctx.restore();
    } else if (f.type === 'special') {
        ctx.save(); ctx.translate(x, y); ctx.rotate(t*2);
        ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 8;
        const s = 7+pulse*0.5;
        ctx.fillRect(-s/1.4, -s/1.4, s*1.4, s*1.4);
        ctx.restore();
    } else {
        ctx.fillStyle = col + '44';
        ctx.beginPath(); ctx.arc(x, y, 8+pulse, 0, TAU); ctx.fill();
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(x, y, 4.5+pulse*0.5, 0, TAU); ctx.fill();
    }
}

function drawGrid(camX, camY) {
    ctx.strokeStyle = 'rgba(120,150,255,.06)'; ctx.lineWidth = 1;
    const gs = 100;
    const x0 = Math.floor(camX/gs)*gs, y0 = Math.floor(camY/gs)*gs;
    ctx.beginPath();
    for (let x = x0; x < camX+W+gs; x += gs) { ctx.moveTo(x-camX, 0); ctx.lineTo(x-camX, H); }
    for (let y = y0; y < camY+H+gs; y += gs) { ctx.moveTo(0, y-camY); ctx.lineTo(W, y-camY); }
    ctx.stroke();
    ctx.save();
    ctx.strokeStyle = 'rgba(255,60,60,.8)'; ctx.lineWidth = 6;
    ctx.shadowColor = '#f00'; ctx.shadowBlur = 20;
    ctx.strokeRect(-camX, -camY, WORLD_SIZE, WORLD_SIZE);
    ctx.restore();
}

/* ============ LÓGICA LOCAL ============ */
function updateMe() {
    if (!me.alive) return;
    if (frame % 2 === 0) {
        Object.keys(me.abilities).forEach(k => {
            const a = me.abilities[k];
            if (a.cd > 0) a.cd--;
            if (a.active > 0) a.active--;
        });
    }
    let speed = 3;
    if (me.abilities.dash.active > 0) speed = 6;

    // Dirección: joystick en móvil, mouse en PC
    let ta = null;
    if (isMobile) {
        if (joyActive) ta = Math.atan2(joyVec.y, joyVec.x);
    } else {
        ta = Math.atan2(mouseY - H/2, mouseX - W/2);
    }
    if (ta !== null) {
        let d = ta - me.angle; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
        me.angle += d * 0.12;
    }

    const head = me.segments[0];
    head.x = Math.max(0, Math.min(WORLD_SIZE, head.x + Math.cos(me.angle)*speed));
    head.y = Math.max(0, Math.min(WORLD_SIZE, head.y + Math.sin(me.angle)*speed));
    for (let i = 1; i < me.segments.length; i++) {
        const p = me.segments[i-1], s = me.segments[i];
        const dx = p.x-s.x, dy = p.y-s.y, dist = Math.hypot(dx,dy);
        if (dist > 10) { const a = Math.atan2(dy,dx); s.x = p.x-Math.cos(a)*10; s.y = p.y-Math.sin(a)*10; }
    }
    while (me.segments.length > me.maxSegments) me.segments.pop();
    while (me.segments.length < me.maxSegments) {
        const l = me.segments[me.segments.length-1]; me.segments.push({x:l.x, y:l.y});
    }

    const magnetOn = me.abilities.magnet.active > 0;
    worldFoods = worldFoods.filter(f => {
        const dx = f.x-head.x, dy = f.y-head.y, dist = Math.hypot(dx,dy);
        if (magnetOn && dist < 200 && dist > 25) { f.x -= dx*0.06; f.y -= dy*0.06; }
        if (dist < 28) {
            const v = f.type === 'big' ? 5 : f.type === 'special' ? 3 : 1;
            me.maxSegments = Math.min(400, me.maxSegments + v);
            me.score += v;
            burst(f.x, f.y, foodColor(f), 8);
            socket.emit('eatFood', f.id);
            return false;
        }
        return true;
    });

    remotes.forEach(r => {
        if (!r.alive) return;
        for (let i = 1; i < r.segments.length; i++) {
            const s = r.segments[i];
            if (Math.hypot(s.x-head.x, s.y-head.y) < 24) {
                if (me.abilities.shield.active <= 0) { die(`💀 ${r.name} te eliminó`); return; }
            }
        }
    });
    if (me.alive && (head.x <= 2 || head.x >= WORLD_SIZE-2 || head.y <= 2 || head.y >= WORLD_SIZE-2)) {
        die('💥 Te estrellaste contra el borde');
    }

    socket.emit('updatePlayer', {
        x: head.x, y: head.y, angle: me.angle, segments: me.segments,
        maxSegments: me.maxSegments, score: me.score, abilities: me.abilities
    });
}

function useAbility(k) {
    if (state !== 'playing' || !me.alive) return;
    const a = me.abilities[k];
    if (a.cd === 0) {
        a.active = AB_DEF[k].dur; a.cd = AB_DEF[k].cd;
        socket.emit('useAbility', k);
        toast(`${AB_DEF[k].icon} ¡${AB_DEF[k].name}!`);
    }
}
function die(reason) {
    if (!me.alive) return;
    me.alive = false;
    deathTime = performance.now();
    shake = 25;
    burst(me.segments[0].x, me.segments[0].y, `hsl(${me.hue},85%,60%)`, 50);
    socket.emit('playerDied', { killedBy: 'client' });
    document.getElementById('deathReason').textContent = reason;
    document.getElementById('deathScore').textContent = `Longitud final: ${me.score}`;
    document.getElementById('death').style.display = 'flex';
    state = 'dead';
}

/* ============ INPUT TECLADO ============ */
window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'Enter' && !isMobile) { document.getElementById('chatInput').focus(); e.preventDefault(); return; }
    const map = { '1':'dash', '2':'shield', '3':'magnet', '4':'poison', ' ':'dash' };
    if (map[e.key]) { useAbility(map[e.key]); e.preventDefault(); }
});
const chatInput = document.getElementById('chatInput');
chatInput.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') {
        if (chatInput.value.trim()) socket.emit('chatMessage', chatInput.value.trim());
        chatInput.value = ''; chatInput.blur();
    }
    if (e.key === 'Escape') chatInput.blur();
});

/* ============ HUD ============ */
function updateHUD() {
    document.getElementById('scoreVal').textContent = me.score;
    Object.keys(AB_DEF).forEach(k => {
        const a = me.abilities[k];
        [abUI[k], mabUI[k]].forEach(ui => {
            if (!ui) return;
            ui.cdEl.style.transform = `scaleY(${a.cd / AB_DEF[k].cd})`;
            ui.el.classList.toggle('ready', a.cd === 0);
            ui.el.classList.toggle('active', a.active > 0);
        });
    });
    const all = [{ name: me.name+' (Tú)', score: me.score, me: true, alive: me.alive }];
    remotes.forEach(r => { if (r.alive) all.push({ name: r.name, score: r.score, me: false }); });
    all.sort((a,b) => b.score - a.score);
    const myRank = all.findIndex(x => x.me) + 1;
    document.getElementById('rankTxt').textContent = `Rank #${myRank} de ${all.length}`;
    document.getElementById('onlineCount').textContent = all.length;
    document.getElementById('lbList').innerHTML = all.slice(0, 8).map((p, i) => {
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;
        return `<div class="lb-row${p.me ? ' me' : ''}"><span>${medal} ${p.name}</span><span>${p.score}</span></div>`;
    }).join('');
}
function drawMinimap(camX, camY) {
    const S = 170, sc = S / WORLD_SIZE;
    mm.clearRect(0, 0, S, S);
    mm.fillStyle = 'rgba(5,10,20,.9)'; mm.fillRect(0, 0, S, S);
    for (let i = 0; i < worldFoods.length; i += 4) {
        const f = worldFoods[i];
        mm.fillStyle = f.type === 'big' ? '#ffd700' : 'rgba(255,255,255,.25)';
        mm.fillRect(f.x*sc, f.y*sc, f.type === 'big' ? 2 : 1, f.type === 'big' ? 2 : 1);
    }
    remotes.forEach(r => {
        if (!r.alive) return;
        mm.fillStyle = `hsl(${r.hue},85%,55%)`;
        mm.beginPath(); mm.arc(r.segments[0].x*sc, r.segments[0].y*sc, 2.5, 0, TAU); mm.fill();
    });
    if (me.alive) {
        mm.fillStyle = '#7CFC7C';
        mm.beginPath(); mm.arc(me.segments[0].x*sc, me.segments[0].y*sc, 3.5, 0, TAU); mm.fill();
    }
    mm.strokeStyle = 'rgba(255,255,255,.35)'; mm.lineWidth = 1;
    mm.strokeRect(camX*sc, camY*sc, W*sc, H*sc);
    mm.strokeStyle = 'rgba(255,60,60,.6)'; mm.strokeRect(0.5, 0.5, S-1, S-1);
}

/* ============ LOGO ============ */
const logoCtx = document.getElementById('logoCanvas').getContext('2d');
function drawLogo(t) {
    logoCtx.clearRect(0, 0, 190, 150);
    const cx = 95, cy = 78;
    const pts = [];
    for (let i = 0; i < 14; i++) {
        const a = t*1.2 - i*0.28;
        const r = 34 + Math.sin(t*2 + i*0.5)*6;
        pts.push({ x: cx + Math.cos(a)*r*1.25, y: cy + Math.sin(a)*r*0.75 });
    }
    const fake = { segments: pts, angle: Math.atan2(pts[0].y-pts[1].y, pts[0].x-pts[1].x),
        hue: 120, name: '', alive: true, abilities: {} };
    drawCentOn(logoCtx, fake, 0, 0, t);
}
function drawCentOn(g, c, camX, camY, t) {
    const prev = ctx; ctx = g;
    const oldW = W, oldH = H; W = 190; H = 150;
    drawCentipede(c, camX, camY, t);
    ctx = prev; W = oldW; H = oldH;
}

/* ============ LOOP ============ */
function loop() {
    requestAnimationFrame(loop);
    frame++;
    const t = performance.now() / 1000;

    ctx.fillStyle = '#0b1020';
    ctx.fillRect(0, 0, W, H);

    let camX, camY;
    if (state === 'menu') {
        updateDemo();
        camX = WORLD_SIZE/2 + Math.cos(t*0.07)*900 - W/2;
        camY = WORLD_SIZE/2 + Math.sin(t*0.07)*900 - H/2;
        drawGrid(camX, camY);
        demoFoods.forEach(f => drawFood(f, camX, camY, t));
        demoCents.forEach(c => drawCentipede(c, camX, camY, t));
        drawLogo(t);
        return;
    }

    if (state === 'playing') updateMe();
    remotes.forEach(r => r.update());

    const head = me.segments[0] || { x: WORLD_SIZE/2, y: WORLD_SIZE/2 };
    camX = head.x - W/2; camY = head.y - H/2;
    if (shake > 0) { shake--; camX += (Math.random()-0.5)*shake; camY += (Math.random()-0.5)*shake; }

    drawGrid(camX, camY);
    worldFoods.forEach(f => drawFood(f, camX, camY, t));
    remotes.forEach(r => drawCentipede(r, camX, camY, t));
    if (me.alive) drawCentipede(me, camX, camY, t);

    for (let i = particles.length-1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life--;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.life / p.max;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x-camX, p.y-camY, p.size, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
    }

    if (state === 'playing' && me.alive && !isMobile) {
        ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(mouseX, mouseY, 9, 0, TAU); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,.25)';
        ctx.beginPath(); ctx.arc(mouseX, mouseY, 15, 0, TAU); ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(mouseX, mouseY, 2, 0, TAU); ctx.fill();
    }

    if (state === 'dead') {
        const left = Math.max(0, 5 - (performance.now()-deathTime)/1000);
        document.getElementById('respawnTxt').textContent = `Renaciendo en ${Math.ceil(left)}...`;
    }

    updateHUD();
    if (!isMobile) drawMinimap(camX, camY);
}
loop();

/* ============ ARRANQUE ============ */
document.getElementById('playBtn').addEventListener('click', () => {
    me.name = document.getElementById('nameInput').value.trim() || 'Jugador';
    me.hue = SKINS[selSkin].hue;
    document.getElementById('menu').style.display = 'none';
    if (!isMobile) document.body.classList.add('playing');
    resetMe(WORLD_SIZE/2, WORLD_SIZE/2);
    socket.emit('joinGame', { name: me.name, color: me.hue });
    state = 'playing';
    toast(`🎮 ¡Bienvenido, ${me.name}!`);
    if (isMobile && window.innerHeight > window.innerWidth) {
        setTimeout(() => toast('📱 Girá el celular para jugar mejor'), 1200);
    }
});
</script>
